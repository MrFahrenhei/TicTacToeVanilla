<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <title>TicTacToe Vanilla JS</title>
    <link rel="stylesheet" href="css/index.css">
  </head>
  <body>
    <main class="container">
      <div class="grid">
        <div class="turn">
          <i class="fa-solid fa-x  turquoise"></i>
          <p>Player 1, you're up!</p>
        </div>
       <!--  <div class="actions"></div> -->
        <div class="menu">
          <button class="menu-btn" data-id="menu-button">
            Actions <i class="fa-solid fa-chevron-down"></i>
          </button>
          <div class="items border hidden" data-id="menu-popover">
            <button data-id="reset-btn">Reset</button>
            <button data-id="new-round-btn">New Round</button>
          </div>
        </div>
        <div class="square shadow"></div>
        <div class="square shadow"></div>
        <div class="square shadow"></div>
        <div class="square shadow"></div>
        <div class="square shadow"></div>
        <div class="square shadow"></div>
        <div class="square shadow"></div>
        <div class="square shadow"></div>
        <div class="square shadow"></div>
        <div class="score"></div>
        <div class="score"></div>
        <div class="score"></div>
      </div>
    </main>
    <footer>
      <p>Original by me</p>
      <p>Refactored using vanilla JS by me</p>
    </footer>
  </body>
  <script src="https://kit.fontawesome.com/3bfd3ce9e5.js" crossorigin="anonymous"></script>
</html>
